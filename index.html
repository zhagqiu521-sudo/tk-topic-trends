<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社媒话题数据看板 · CapCut / Hypic</title>
<style>
  /* 配色对齐 红果播放监控（Qt）表格风格 */
  :root { --bg:#16181d; --panel:#1f232b; --panel2:#252a33; --border:#2f3540;
          --text:#e6e8ec; --dim:#9aa4b2; --green:#2ecc71; --green-d:#27a05c;
          --red:#e74c3c; --gold:#e5b567; --sel:#2b5c3f; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font-family:"Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;
         font-size:13px; padding:14px 18px 60px; max-width:1280px; margin:0 auto; }
  h1 { font-size:17px; margin-bottom:10px; }
  .refresh { float:right; border:1px solid var(--border); background:var(--panel2); color:var(--text);
             border-radius:4px; padding:5px 14px; cursor:pointer; font-size:13px; }
  .refresh:hover { border-color:var(--green); }

  /* 时区对比条 */
  .tzbar { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center;
           background:var(--panel); border:1px solid var(--border); border-radius:6px;
           padding:9px 14px; margin-bottom:10px; }
  .tzbox { display:flex; align-items:center; gap:8px; }
  .tzlabel { color:var(--dim); font-size:13px; }
  .tzclock { font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--green); }
  .tzbox.compare .tzclock { color:var(--blue,#58a6ff); }
  .tzvs { color:var(--dim); font-size:12px; }
  .tzbar select { background:#363d4a; color:var(--text); border:1px solid var(--border);
                  border-radius:4px; padding:3px 8px; font-size:13px; cursor:pointer; }
  .tzbar select:hover { border-color:var(--green); }
  .tznote { color:var(--dim); font-size:12px; margin-left:auto; }

  /* 筛选条 */
  .filterbar { position:sticky; top:0; z-index:10; background:var(--bg);
               padding:8px 0 10px; border-bottom:1px solid var(--border); margin-bottom:10px; }
  .chiprow { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .chiplabel { color:var(--dim); font-size:13px; margin-right:2px; }
  .chip { border:1px solid var(--border); background:var(--panel2); color:var(--text);
          border-radius:4px; padding:4px 13px; font-size:13px; cursor:pointer; user-select:none;
          display:inline-flex; align-items:center; gap:4px; }
  .chip:hover { border-color:var(--green); }
  .chip.active { background:rgba(46,204,113,.16); border-color:var(--green); color:var(--green); font-weight:bold; }
  .chip .dir { font-size:11px; }
  .filterbar select { background:#363d4a; color:var(--text); border:1px solid var(--border);
                      border-radius:4px; padding:4px 8px; font-size:13px; cursor:pointer; max-width:260px; }
  .filterbar select:hover { border-color:var(--green); }
  .sep { width:100%; height:7px; }

  .meta { color:var(--dim); font-size:12.5px; margin-bottom:8px; }
  .meta .num { color:var(--green); }

  /* 表格（斑马纹对齐红果监控） */
  .tablewrap { overflow-x:auto; }
  .vtable { width:100%; border-collapse:collapse; font-size:13px; background:var(--panel2); }
  .vtable th { background:var(--panel); color:var(--dim); font-weight:bold; text-align:left;
               padding:7px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
  .vtable td { padding:8px 10px; border-bottom:1px solid var(--border); }
  .vtable tbody tr:nth-child(odd)  { background:var(--panel2); }
  .vtable tbody tr:nth-child(even) { background:var(--panel); }
  .vtable tbody tr:hover { background:rgba(46,204,113,.08); }
  .vtable tbody tr { cursor:pointer; }
  .vtable .num { text-align:right; font-variant-numeric:tabular-nums; }
  .vtable th.num { text-align:right; }
  .rk { display:inline-block; min-width:22px; text-align:center; border-radius:3px;
        padding:1px 5px; color:var(--dim); font-weight:bold; }
  .rk.top { background:var(--green); color:#0d1014; }
  .rk.gold { background:var(--gold); color:#0d1014; }
  .vtitle { max-width:430px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .vtitle a { color:var(--text); text-decoration:none; }
  .vtitle a:hover { color:var(--green); }
  .tagbadge { display:inline-block; border:1px solid var(--border); border-radius:3px;
              padding:1px 6px; font-size:11.5px; margin-right:3px; white-space:nowrap; }
  .liked b { color:var(--red); } .faved b { color:var(--gold); }
  .st b { font-weight:bold; }
  .tcell { white-space:nowrap; line-height:1.5; }
  .tcell .rel { color:var(--dim); font-size:12px; }
  .tcell .main { font-variant-numeric:tabular-nums; }
  .pager { display:flex; gap:10px; align-items:center; justify-content:center; padding:16px 0 4px; }
  .pager button { border:1px solid var(--border); background:var(--panel2); color:var(--text);
                  border-radius:4px; padding:5px 14px; cursor:pointer; font-size:13px; }
  .pager button:disabled { opacity:.4; cursor:default; }
  .pager button:not(:disabled):hover { border-color:var(--green); }
  .pager .pinfo { color:var(--dim); font-size:13px; }
  .empty { color:var(--dim); text-align:center; padding:50px 0; font-size:14px; }
  .loading { color:var(--dim); text-align:center; padding:50px 0; }

  #toTop { position:fixed; right:24px; bottom:28px; width:42px; height:42px; border-radius:4px;
           border:1px solid var(--border); background:var(--panel2); color:var(--text); font-size:17px;
           cursor:pointer; display:none; z-index:50; box-shadow:0 4px 14px rgba(0,0,0,.4); }
  #toTop.show { display:block; }
  #toTop:hover { border-color:var(--green); color:var(--green); }

  /* 登录门 */
  #authGate { position:fixed; inset:0; background:var(--bg); z-index:100; display:none;
              align-items:center; justify-content:center; }
  .authcard { background:var(--panel); border:1px solid var(--border); border-radius:10px;
              padding:26px 28px; width:320px; }
  .authcard h2 { text-align:center; font-size:16px; margin-bottom:16px; }
  .authrow { margin-bottom:10px; }
  .authcard input { width:100%; box-sizing:border-box; background:#252a33; color:var(--text);
                    border:1px solid var(--border); border-radius:4px; padding:8px 10px; font-size:14px; }
  .authbtn { width:100%; background:var(--green); color:#0d1014; font-weight:bold; border:none;
             border-radius:4px; padding:8px; cursor:pointer; font-size:14px; }
  .authsep { text-align:center; color:var(--dim); font-size:12px; margin:12px 0; }
  #amsg { text-align:center; color:var(--dim); font-size:12.5px; min-height:18px; margin-top:10px; }
</style>
</head>
<body>
<div id="authGate" style="display:none">
  <div class="authcard">
    <h2>话题数据看板 · 登录</h2>
    <form id="loginForm" autocomplete="on">
      <div class="authrow"><input id="au" name="username" placeholder="用户名" autocomplete="username"></div>
      <div class="authrow"><input id="ap" type="password" name="password" placeholder="密码" autocomplete="current-password"></div>
      <button class="authbtn" type="submit">登 录</button>
    </form>
    <div class="authsep"><a href="javascript:void(0)" id="showReg" style="color:#58a6ff;text-decoration:none">— 没有账号？点此注册 —</a></div>
    <div id="regBlock" style="display:none">
      <div class="authrow" style="margin-bottom:6px"><span style="color:var(--dim);font-size:12px">注册后需管理员批准才能登录</span></div>
      <div class="authrow"><input id="ru" placeholder="用户名（字母数字._-）" autocomplete="off"></div>
      <div class="authrow"><input id="rp" type="password" placeholder="密码（至少 6 位）" autocomplete="new-password"></div>
      <button class="authbtn" id="areg">注 册</button>
    </div>
    <div id="amsg"></div>
  </div>
</div>
<div id="app" style="display:none">
<button class="refresh" onclick="load()">刷新</button>
<button class="refresh" id="logoutBtn" style="margin-right:8px">退出</button>
<h1>社媒话题数据看板</h1>

<div class="tzbar">
  <div class="tzbox">
    <span class="tzlabel">北京时间</span>
    <span class="tzclock" id="clockBJ">--</span>
  </div>
  <span class="tzvs">对比 ⇄</span>
  <div class="tzbox compare">
    <select id="tzSelect" title="选择后，下方列表的发布时间将切换为该时区"></select>
    <span class="tzclock" id="clockSel">--</span>
  </div>
  <span class="tznote">切换时区后，下方列表的发布时间同步切换</span>
</div>

<div class="filterbar">
  <div class="chiprow">
    <span class="chiplabel">产品</span>
    <span class="chip topic active" data-topic="all">全部</span>
    <span class="chip topic" data-topic="capcut">CapCut（剪映）</span>
    <span class="chip topic" data-topic="hypic">Hypic（醒图）</span>
    <span class="chip linked" data-linked="0">🔗 仅挂链</span>
    <span class="chiplabel" style="margin-left:8px">模板</span>
    <select id="tplSelect"><option value="">全部</option></select>
  </div>
  <div class="sep"></div>
  <div class="chiprow">
    <span class="chiplabel">时间</span>
    <span class="chip window active" data-hours="48">48小时内</span>
    <span class="chip window" data-hours="24">24小时内</span>
    <span class="chip window" data-hours="12">12小时内</span>
    <span class="chip window" data-hours="6">6小时内</span>
  </div>
  <div class="sep"></div>
  <div class="chiprow">
    <span class="chiplabel">排序</span>
    <span class="chip sort active" data-key="created_at">发布时间 <span class="dir">↓</span></span>
    <span class="chip sort" data-key="digg">点赞 <span class="dir"></span></span>
    <span class="chip sort" data-key="play">播放 <span class="dir"></span></span>
    <span class="chip sort" data-key="collect">收藏 <span class="dir"></span></span>
    <span class="chip sort" data-key="share">转发 <span class="dir"></span></span>
  </div>
</div>

<div class="meta" id="meta"></div>
<div id="list" class="loading">正在加载……</div>
<div class="pager" id="pager" style="display:none">
  <button id="prevBtn">← 上一页</button>
  <span class="pinfo" id="pinfo"></span>
  <button id="nextBtn">下一页 →</button>
</div>

<button id="toTop" title="返回顶部">↑</button>

<script>
// data source: encrypted JSON lives on github.io (same-origin) and jsDelivr (CORS open, for file:// and tk.exapple.xyz)
const BASE = (location.protocol === "file:" || location.hostname.endsWith("exapple.xyz"))
  ? "https://cdn.jsdelivr.net/gh/zhagqiu521-sudo/tk-topic-trends@main/data"
  : location.pathname.replace(/index\.html?$/, "") + "data";

const FALLBACK_PRODUCTS = {
  capcut: { label: "CapCut（剪映）", tags: ["capcut", "capcutpioneer", "capcutnow"] },
  hypic:  { label: "Hypic（醒图）",  tags: ["hypic", "hypiccreator", "godpic"] },
};
const TAGS   = { capcut:"#capcut", capcutpioneer:"#capcutpioneer", capcutnow:"#capcutnow",
                 hypic:"#hypic", hypiccreator:"#hypiccreator", godpic:"#Godpic" };
const TAGCOL = { capcut:"#58a6ff", capcutpioneer:"#bc8cff", capcutnow:"#f0883e",
                 hypic:"#2ecc71", hypiccreator:"#39c5cf", godpic:"#d2a8ff" };
const SORTNAMES = { created_at:"发布时间", digg:"点赞", play:"播放", collect:"收藏", share:"转发" };
const ZONES = [ ["北京","Asia/Shanghai"], ["东京","Asia/Tokyo"], ["伦敦","Europe/London"],
                ["纽约","America/New_York"], ["洛杉矶","America/Los_Angeles"], ["UTC","UTC"] ];
const TZ_OPTIONS = [ ["纽约","America/New_York"], ["洛杉矶","America/Los_Angeles"], ["伦敦","Europe/London"],
                     ["巴黎","Europe/Paris"], ["莫斯科","Europe/Moscow"], ["迪拜","Asia/Dubai"],
                     ["东京","Asia/Tokyo"], ["首尔","Asia/Seoul"], ["新加坡","Asia/Singapore"],
                     ["悉尼","Australia/Sydney"], ["北京","Asia/Shanghai"], ["UTC","UTC"] ];
const PAGE_SIZE = 50;
const state = { product:"all", sortKey:"created_at", sortDir:"desc", hours:48, page:1, linkedOnly:false, tpl:"" };
let viewTz = localStorage.getItem("viewTz") || "America/New_York";
let viewTzName = "纽约";

const fmt = n => n>=10000 ? (n/10000).toFixed(1)+"w" : n>=1000 ? (n/1000).toFixed(1)+"k" : String(n);
const ago = ts => {
  const m = Math.floor(Date.now()/1000 - ts);
  if (m < 60) return "刚刚";
  if (m < 3600) return Math.floor(m/60) + "分钟前";
  if (m < 86400) return Math.floor(m/3600) + "小时前";
  return Math.floor(m/86400) + "天前";
};
const tzFmtCache = {};
function tzTime(ts, tz){
  if(!tzFmtCache[tz]) tzFmtCache[tz] = new Intl.DateTimeFormat("zh-CN",
    { timeZone: tz, month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hour12:false });
  return tzFmtCache[tz].format(new Date(ts*1000));
}
function tzTooltip(ts){
  return ZONES.map(([k,tz]) => k+" "+tzTime(ts,tz)).join("\n");
}

async function getJSON(url){
  const r = await fetch(url, {cache:"no-store"});
  if(!r.ok) throw new Error(r.status+" "+url);
  return r.json();
}

// ---- encrypted data layer: file = [16B IV][AES-256-CBC ciphertext] ----
function hexBuf(h){ const a=new Uint8Array(h.length/2); for(let i=0;i<a.length;i++) a[i]=parseInt(h.substr(i*2,2),16); return a; }
async function getEncJSON(name){
  if(!window._dkey) throw new Error("未取得数据密钥");
  const r = await fetch(BASE+"/"+name+".enc", {cache:"no-store"});
  if(!r.ok) throw new Error(r.status+" "+name);
  const buf = new Uint8Array(await r.arrayBuffer());
  const key = await crypto.subtle.importKey("raw", hexBuf(window._dkey), {name:"AES-CBC"}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-CBC", iv: buf.slice(0,16)}, key, buf.slice(16));
  return JSON.parse(new TextDecoder().decode(plain));
}

let cache = null, products = FALLBACK_PRODUCTS;

async function load(){
  if(window._creds){ authAPI({action:"ping", username:window._creds.username, token:window._creds.token})
    .then(r=>{ if(r.ok && r.dkey) window._dkey = r.dkey; }).catch(()=>{}); }
  try{
    const el=document.getElementById("list");
    el.className="loading"; el.textContent="正在加载……";
    const snap = await getEncJSON("latest.json");
    cache = snap;
    // normalize products: accept both {tag:[...]} legacy shape and {label,tags} shape
    if(snap.products){
      products = {};
      for(const [k,v] of Object.entries(snap.products)){
        products[k] = Array.isArray(v) ? {label: k, tags: v} : {label: v.label || k, tags: v.tags || []};
      }
    }
    render();
  }catch(e){
    const el=document.getElementById("list");
    el.className="empty"; el.textContent="加载失败("+e.message+")，稍后点右上角「刷新」。";
  }
}

function allVideos(){
  if(!cache) return [];
  const map = new Map();   // dedupe by video_id across all tags
  for(const [tag, t] of Object.entries(cache.topics)){
    for(const v of (t.items||[])){
      if(map.has(v.video_id)){ map.get(v.video_id).tags.push(tag); }
      else { map.set(v.video_id, {...v, tags:[tag]}); }
    }
  }
  return [...map.values()];
}

function render(){
  const list=document.getElementById("list");
  if(!cache) return;
  let vids = allVideos();
  if(state.product!=="all"){
    const tags = (products[state.product] && products[state.product].tags) || [];
    vids = vids.filter(v=>v.tags.some(t=>tags.includes(t)));
  }
  if(state.linkedOnly) vids = vids.filter(v=>v.linked===true);
  if(state.tpl) vids = vids.filter(v=>v.anchor===state.tpl);

  // 模板下拉：从已确认挂链的作品聚合 keyword
  const kwSet = new Map();
  for(const v of allVideos()){
    if(v.linked===true && v.anchor) kwSet.set(v.anchor,(kwSet.get(v.anchor)||0)+1);
  }
  const tplSel=document.getElementById("tplSelect");
  const cur=state.tpl;
  tplSel.innerHTML = "<option value=''>全部（"+kwSet.size+" 个锚点）</option>" +
    [...kwSet.entries()].sort((a,b)=>b[1]-a[1])
      .map(([k,c])=>"<option value='"+escapeHtml(k)+"'>"+escapeHtml(k)+"（"+c+"）</option>").join("");
  tplSel.value=[...tplSel.options].some(o=>o.value===cur)?cur:"";
  state.tpl=tplSel.value;
  const nowTs = Date.now()/1000;
  vids = vids.filter(v=>v.created_at >= nowTs - state.hours*3600);

  const dir = state.sortDir==="desc" ? -1 : 1;
  vids.sort((a,b)=> (a[state.sortKey]>b[state.sortKey] ? dir : a[state.sortKey]<b[state.sortKey] ? -dir : 0));

  const totalPages = Math.max(1, Math.ceil(vids.length/PAGE_SIZE));
  if(state.page>totalPages) state.page=totalPages;
  if(state.page<1) state.page=1;
  const pageVids = vids.slice((state.page-1)*PAGE_SIZE, state.page*PAGE_SIZE);

  const cnt = {};
  for(const p of Object.keys(products)){
    const tags = (products[p] && products[p].tags) || [];
    cnt[p] = allVideos().filter(v=>v.tags.some(t=>tags.includes(t)) && v.created_at >= nowTs - state.hours*3600).length;
  }
  document.getElementById("meta").innerHTML =
    "共 <span class='num'>"+vids.length+"</span> 条（"+state.hours+"小时内）｜ " +
    Object.entries(products).map(([p,def])=>def.label+" <span class='num'>"+cnt[p]+"</span>").join(" · ") +
    "　<span style='opacity:.6'>排序："+SORTNAMES[state.sortKey]+" "+(state.sortDir==="desc"?"倒序":"正序")+"</span>";

  const pager=document.getElementById("pager");
  if(totalPages>1){
    pager.style.display="flex";
    document.getElementById("pinfo").textContent = "第 "+state.page+" / "+totalPages+" 页（每页 "+PAGE_SIZE+" 条）";
    document.getElementById("prevBtn").disabled = state.page<=1;
    document.getElementById("nextBtn").disabled = state.page>=totalPages;
  } else { pager.style.display="none"; }

  if(!pageVids.length){
    list.className="empty";
    list.textContent="该筛选条件下暂无作品（该时段新作品较少，等下一轮采集后刷新）。";
    return;
  }
  list.className="";
  const rankBase = (state.page-1)*PAGE_SIZE;
  list.innerHTML = `<div class="tablewrap"><table class="vtable">
    <thead><tr>
      <th>排名</th><th>作品</th><th>话题</th><th>作者</th>
      <th class="num">点赞</th><th class="num">收藏</th><th class="num">评论</th>
      <th class="num">转发</th><th class="num">播放</th><th>发布时间</th>
    </tr></thead><tbody>
    ` + pageVids.map((v,i)=>{
    const rank = rankBase+i+1;
    const rkCls = rank<=3 ? "top" : rank<=10 ? "gold" : "";
    const tags = v.tags.map(t=>"<span class='tagbadge' style='color:"+TAGCOL[t]+";border-color:"+TAGCOL[t]+"55'>"+TAGS[t]+"</span>").join("");
    const linkBadge = v.linked ? "<span class='tagbadge' style='color:var(--green);border-color:rgba(46,204,113,.4)' title='"+escapeHtml(v.anchor||"")+"'>🔗 挂链</span>" : "";
    const url = "https://www.tiktok.com/@"+v.author+"/video/"+v.video_id;
    return `<tr data-url="${url}">
      <td><span class="rk ${rkCls}">${rank}</span></td>
      <td class="vtitle" title="${escapeHtml(v.title)}"><a href="${url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${escapeHtml(v.title)||"(无标题)"}</a></td>
      <td style="white-space:nowrap">${linkBadge}${tags}</td>
      <td style="white-space:nowrap">@${escapeHtml(v.author)||"unknown"}</td>
      <td class="num liked"><b>${fmt(v.digg)}</b></td>
      <td class="num faved"><b>${fmt(v.collect)}</b></td>
      <td class="num">${fmt(v.comment)}</td>
      <td class="num">${fmt(v.share)}</td>
      <td class="num">${fmt(v.play)}</td>
      <td class="tcell" title="${escapeHtml(tzTooltip(v.created_at))}">
        <div class="rel">${ago(v.created_at)}</div>
        <div class="main">${viewTzName} ${tzTime(v.created_at, viewTz)}</div>
      </td>
    </tr>`;
  }).join("") + `</tbody></table></div>`;

  // 整行可点
  list.querySelectorAll("tr[data-url]").forEach(tr=>{
    tr.addEventListener("click",()=>window.open(tr.dataset.url,"_blank","noopener"));
  });
}

function escapeHtml(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function resetPage(){ state.page=1; }

// interactions
document.querySelectorAll(".chip.topic").forEach(ch=>ch.addEventListener("click",()=>{
  document.querySelectorAll(".chip.topic").forEach(c=>c.classList.remove("active"));
  ch.classList.add("active"); state.product=ch.dataset.topic; resetPage(); render();
}));
document.querySelector(".chip.linked").addEventListener("click",()=>{
  state.linkedOnly=!state.linkedOnly;
  document.querySelector(".chip.linked").classList.toggle("active", state.linkedOnly);
  resetPage(); render();
});
document.getElementById("tplSelect").addEventListener("change",()=>{
  state.tpl=document.getElementById("tplSelect").value; resetPage(); render();
});
document.querySelectorAll(".chip.window").forEach(ch=>ch.addEventListener("click",()=>{
  document.querySelectorAll(".chip.window").forEach(c=>c.classList.remove("active"));
  ch.classList.add("active"); state.hours=+ch.dataset.hours; resetPage(); render();
}));
document.querySelectorAll(".chip.sort").forEach(ch=>ch.addEventListener("click",()=>{
  const key=ch.dataset.key;
  if(state.sortKey===key){ state.sortDir = state.sortDir==="desc"?"asc":"desc"; }
  else { state.sortKey=key; state.sortDir="desc"; }
  document.querySelectorAll(".chip.sort").forEach(c=>{
    c.classList.toggle("active", c.dataset.key===state.sortKey);
    c.querySelector(".dir").textContent = c.dataset.key===state.sortKey ? (state.sortDir==="desc"?"↓":"↑") : "";
  });
  resetPage(); render();
}));
document.getElementById("prevBtn").addEventListener("click",()=>{ state.page--; render();
  document.querySelector(".filterbar").scrollIntoView({behavior:"smooth"}); });
document.getElementById("nextBtn").addEventListener("click",()=>{ state.page++; render();
  document.querySelector(".filterbar").scrollIntoView({behavior:"smooth"}); });

const clockCache={};
function clock(tz){
  if(!clockCache[tz]) clockCache[tz]=new Intl.DateTimeFormat("zh-CN",
    {timeZone:tz,month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
  return clockCache[tz].format(new Date());
}
function tickClocks(){
  document.getElementById("clockBJ").textContent=clock("Asia/Shanghai");
  document.getElementById("clockSel").textContent=clock(viewTz);
}
tickClocks();
setInterval(tickClocks,1000);

// ---- 登录门（tk-auth Worker）----
// 双端点兜底：自定义域名优先（无污染），workers.dev 备用（国内偶发波动）
const AUTH_ENDPOINTS = ["https://lzkj.exapple.xyz/api", "https://tk-auth.zhagqiu-tk.workers.dev/api"];
async function authAPI(payload){
  let lastErr = "";
  for(const ep of AUTH_ENDPOINTS){
    try{
      const r = await fetch(ep, { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify(payload) });
      return await r.json();
    }catch(e){ lastErr = ep; }
  }
  return { ok:false, msg:"登录服务不可达，稍后重试" };
}
function showApp(){
  document.getElementById("authGate").style.display="none";
  document.getElementById("app").style.display="block";
  if(!window._loaded){ window._loaded = true; load(); setInterval(load, 10*60*1000); } else { load(); }
}
function showGate(){
  document.getElementById("authGate").style.display="flex";
  document.getElementById("app").style.display="none";
}
async function initAuth(){
  const c = JSON.parse(localStorage.getItem("tk_auth") || "null");
  window._creds = c;
  if(c && c.username){
    document.getElementById("au").value = c.username;   // 账号名本地记住并回填
  }
  if(c && c.username && c.token){
    try{
      const r = await authAPI({action:"ping", username:c.username, token:c.token});
      if(r.ok){ if(r.dkey) window._dkey = r.dkey; showApp(); return; }
    }catch(e){ /* 登录服务不可达：本次放行（游客模式），数据本身公开 */ }
  }
  showGate();
}
document.getElementById("loginForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const u = document.getElementById("au").value.trim().toLowerCase();
  const p = document.getElementById("ap").value;
  document.getElementById("amsg").textContent = "登录中……";
  const r = await authAPI({action:"login", username:u, password:p}).catch(e=>({ok:false,msg:"登录服务不可达，稍后重试"}));
  if(r.ok){
    localStorage.setItem("tk_auth", JSON.stringify({username:u, token:r.token}));
    window._creds = {username:u, token:r.token};
    if(r.dkey) window._dkey = r.dkey;
    showApp();
  } else { document.getElementById("amsg").textContent = r.msg || "登录失败"; }
});
document.getElementById("showReg").addEventListener("click", ()=>{
  const blk = document.getElementById("regBlock");
  const open = blk.style.display !== "none";
  blk.style.display = open ? "none" : "block";
  document.getElementById("showReg").textContent = open ? "— 没有账号？点此注册 —" : "— 返回登录 —";
  if(open) document.getElementById("amsg").textContent = "";
});
document.getElementById("areg").addEventListener("click", async ()=>{
  document.getElementById("amsg").textContent = "提交中……";
  const r = await authAPI({action:"register",
    username:document.getElementById("ru").value.trim().toLowerCase(),
    password:document.getElementById("rp").value}).catch(e=>({ok:false,msg:"注册服务不可达，稍后重试"}));
  document.getElementById("amsg").textContent = r.msg || "";
  if(r.ok){
    document.getElementById("ru").value=""; document.getElementById("rp").value="";
    setTimeout(()=>{                                   // 注册成功：收起注册，回到登录
      document.getElementById("regBlock").style.display="none";
      document.getElementById("showReg").textContent="— 没有账号？点此注册 —";
      document.getElementById("amsg").textContent="";
    }, 2500);
  }
});
document.getElementById("logoutBtn").addEventListener("click", ()=>{
  localStorage.removeItem("tk_auth"); location.reload();
});
initAuth();
</script>
