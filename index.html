<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok 话题最新作品 · capcut / capcutpioneer / capcutnow</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#e6edf3; --dim:#8b949e;
          --green:#3fb950; --blue:#58a6ff; --purple:#bc8cff; --orange:#f0883e; --red:#f85149; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font-family:"Segoe UI",system-ui,sans-serif;
         padding:16px 20px 40px; max-width:1180px; margin:0 auto; }
  h1 { font-size:19px; margin-bottom:2px; }
  .sub { color:var(--dim); font-size:12.5px; margin-bottom:14px; }
  .sub b { color:var(--text); }

  /* 筛选条（抖音搜索结果风格） */
  .filterbar { position:sticky; top:0; z-index:10; background:var(--bg);
               padding:10px 0 12px; border-bottom:1px solid var(--border); margin-bottom:14px; }
  .chiprow { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .chiplabel { color:var(--dim); font-size:13px; margin-right:2px; }
  .chip { border:1px solid var(--border); background:var(--card); color:var(--text);
          border-radius:20px; padding:6px 14px; font-size:13px; cursor:pointer; user-select:none;
          display:inline-flex; align-items:center; gap:4px; }
  .chip:hover { border-color:var(--dim); }
  .chip.active { background:#1f6feb33; border-color:var(--blue); color:var(--blue); font-weight:600; }
  .chip .dir { font-size:11px; }
  .sep { width:100%; height:8px; }

  .meta { color:var(--dim); font-size:12.5px; margin-bottom:10px; }
  .meta .num { color:var(--green); }

  /* 作品列表 */
  .video-item { display:flex; gap:14px; padding:14px 12px; border-bottom:1px solid #21262d;
                text-decoration:none; color:var(--text); border-radius:8px; }
  .video-item:hover { background:var(--card); }
  .rank { color:var(--dim); font-size:15px; width:28px; text-align:right; flex-shrink:0; padding-top:2px; }
  .rank.top { color:#f0883e; font-weight:700; }
  .vbody { flex:1; min-width:0; }
  .vtitle { font-size:14.5px; line-height:1.45; margin-bottom:6px;
            display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .vinfo { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; font-size:12.5px; color:var(--dim); }
  .vinfo .st b { color:var(--text); font-weight:600; }
  .vinfo .st.liked b { color:var(--red); }
  .vinfo .st.faved b { color:#f0883e; }
  .tagbadge { display:inline-block; border:1px solid var(--border); border-radius:4px;
              padding:1px 7px; font-size:11.5px; margin-right:4px; }
  .vtime { margin-left:auto; white-space:nowrap; flex-shrink:0; }
  .empty { color:var(--dim); text-align:center; padding:50px 0; font-size:14px; }
  .loading { color:var(--dim); text-align:center; padding:50px 0; }
  .refresh { float:right; border:1px solid var(--border); background:var(--card); color:var(--text);
             border-radius:8px; padding:6px 13px; cursor:pointer; font-size:13px; }
  .refresh:hover { border-color:var(--blue); }
</style>
</head>
<body>
<button class="refresh" onclick="load()">刷新</button>
<h1>TikTok 话题最新作品</h1>
<div class="sub">#capcut · #capcutpioneer · #capcutnow ｜ 数据：<b id="snapTime">…</b>，每小时自动更新</div>

<div class="filterbar">
  <div class="chiprow">
    <span class="chiplabel">话题</span>
    <span class="chip topic active" data-topic="all">全部</span>
    <span class="chip topic" data-topic="capcut">#capcut</span>
    <span class="chip topic" data-topic="capcutpioneer">#capcutpioneer</span>
    <span class="chip topic" data-topic="capcutnow">#capcutnow</span>
  </div>
  <div class="sep"></div>
  <div class="chiprow">
    <span class="chiplabel">排序</span>
    <span class="chip sort active" data-key="created_at">发布时间 <span class="dir">↓</span></span>
    <span class="chip sort" data-key="digg">点赞 <span class="dir"></span></span>
    <span class="chip sort" data-key="play">播放 <span class="dir"></span></span>
    <span class="chip sort" data-key="collect">收藏 <span class="dir"></span></span>
  </div>
  <div class="sep"></div>
  <div class="chiprow">
    <span class="chiplabel">时间</span>
    <span class="chip window active" data-hours="48">48小时内</span>
    <span class="chip window" data-hours="24">24小时内</span>
    <span class="chip window" data-hours="12">12小时内</span>
  </div>
</div>

<div class="meta" id="meta"></div>
<div id="list" class="loading">正在加载……</div>

<script>
// data source auto-detect: file:// -> jsDelivr CDN; http(s) -> same origin (github.io subpath or worker root)
const BASE = location.protocol === "file:"
  ? "https://cdn.jsdelivr.net/gh/zhagqiu521-sudo/tk-topic-trends@main/data"
  : location.pathname.replace(/index\.html?$/, "") + "data";

const TAGS   = { capcut:"#capcut", capcutpioneer:"#capcutpioneer", capcutnow:"#capcutnow" };
const TAGCOL = { capcut:"#58a6ff", capcutpioneer:"#bc8cff", capcutnow:"#f0883e" };
const state  = { topic:"all", sortKey:"created_at", sortDir:"desc", hours:48 };

const fmt = n => n>=10000 ? (n/10000).toFixed(1)+"w" : n>=1000 ? (n/1000).toFixed(1)+"k" : String(n);
const ago = ts => {
  const m = Math.floor(Date.now()/1000 - ts);
  if (m < 60) return "刚刚";
  if (m < 3600) return Math.floor(m/60) + "分钟前";
  if (m < 86400) return Math.floor(m/3600) + "小时前";
  const d = Math.floor(m/86400); return d + "天前";
};

async function getJSON(url){
  const r = await fetch(url, {cache:"no-store"});
  if(!r.ok) throw new Error(r.status+" "+url);
  return r.json();
}

let cache = null;

async function load(){
  try{
    document.getElementById("list").className="loading";
    document.getElementById("list").textContent="正在加载……";
    const snap = await getJSON(BASE+"/latest.json");
    cache = snap;
    document.getElementById("snapTime").textContent = snap.captured_at.replace("T"," ").slice(0,16)+" UTC";
    render();
  }catch(e){
    const el=document.getElementById("list");
    el.className="empty"; el.textContent="加载失败("+e.message+")，稍后点右上角「刷新」。";
  }
}

function allVideos(){
  if(!cache) return [];
  const map = new Map();   // dedupe by video_id across topics
  for(const [tag, t] of Object.entries(cache.topics)){
    for(const v of (t.items||[])){
      if(map.has(v.video_id)){ map.get(v.video_id).tags.push(tag); }
      else { map.set(v.video_id, {...v, tags:[tag]}); }
    }
  }
  return [...map.values()];
}

function render(){
  const list=document.getElementById("list");
  if(!cache){ return; }
  let vids = allVideos();
  if(state.topic!=="all") vids = vids.filter(v=>v.tags.includes(state.topic));
  const nowTs = Date.now()/1000;
  vids = vids.filter(v=>v.created_at >= nowTs - state.hours*3600);

  const dir = state.sortDir==="desc" ? -1 : 1;
  vids.sort((a,b)=> (a[state.sortKey]>b[state.sortKey] ? dir : a[state.sortKey]<b[state.sortKey] ? -dir : 0));

  const perTopic = {};
  for(const [tag,t] of Object.entries(cache.topics)) perTopic[tag] = (t.items||[]).length;
  document.getElementById("meta").innerHTML =
    "共 <span class='num'>"+vids.length+"</span> 条（48小时窗口内）｜ 各话题捕获：" +
    Object.entries(perTopic).map(([t,c])=>TAGS[t]+" <span class='num'>"+c+"</span>").join(" · ") +
    "　<span style='opacity:.6'>当前排序："+({created_at:"发布时间",digg:"点赞",play:"播放",collect:"收藏"})[state.sortKey]+" "+(state.sortDir==="desc"?"倒序":"正序")+"</span>";

  if(!vids.length){
    list.className="empty";
    list.textContent="该筛选条件下暂无作品（可能该时段新作品较少，等下一轮采集后刷新）。";
    return;
  }
  list.className="";
  list.innerHTML = vids.map((v,i)=>{
    const tags = v.tags.map(t=>"<span class='tagbadge' style='color:"+TAGCOL[t]+";border-color:"+TAGCOL[t]+"55'>"+TAGS[t]+"</span>").join("");
    const url = "https://www.tiktok.com/@"+v.author+"/video/"+v.video_id;
    return `<a class="video-item" href="${url}" target="_blank" rel="noopener">
      <div class="rank ${i<3?"top":""}">${i+1}</div>
      <div class="vbody">
        <div class="vtitle">${escapeHtml(v.title)||"(无标题)"}</div>
        <div class="vinfo">
          ${tags}
          <span>@${escapeHtml(v.author)||"unknown"}</span>
          <span class="st liked">❤ <b>${fmt(v.digg)}</b></span>
          <span class="st faved">★ <b>${fmt(v.collect)}</b></span>
          <span class="st">💬 <b>${fmt(v.comment)}</b></span>
          <span class="st">↗ <b>${fmt(v.share)}</b></span>
          <span class="st">▶ <b>${fmt(v.play)}</b></span>
          <span class="vtime">${ago(v.created_at)}</span>
        </div>
      </div>
    </a>`;
  }).join("");
}

function escapeHtml(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

// interactions
document.querySelectorAll(".chip.topic").forEach(ch=>ch.addEventListener("click",()=>{
  document.querySelectorAll(".chip.topic").forEach(c=>c.classList.remove("active"));
  ch.classList.add("active"); state.topic=ch.dataset.topic; render();
}));
document.querySelectorAll(".chip.window").forEach(ch=>ch.addEventListener("click",()=>{
  document.querySelectorAll(".chip.window").forEach(c=>c.classList.remove("active"));
  ch.classList.add("active"); state.hours=+ch.dataset.hours; render();
}));
document.querySelectorAll(".chip.sort").forEach(ch=>ch.addEventListener("click",()=>{
  const key=ch.dataset.key;
  if(state.sortKey===key){ state.sortDir = state.sortDir==="desc"?"asc":"desc"; }
  else { state.sortKey=key; state.sortDir="desc"; }
  document.querySelectorAll(".chip.sort").forEach(c=>{
    c.classList.toggle("active", c.dataset.key===state.sortKey);
    c.querySelector(".dir").textContent = c.dataset.key===state.sortKey ? (state.sortDir==="desc"?"↓":"↑") : "";
  });
  render();
}));

load();
setInterval(load, 10*60*1000);
</script>
</body>
</html>
