name: collect
on:
  workflow_dispatch: {}   # manual trigger
  schedule:
    - cron: "0 * * * *"   # GitHub drops scheduled fires under load (observed 9/9 overnight),
    - cron: "10 * * * *"  # so we fire six times per hour; collect.py de-dupes to one
    - cron: "20 * * * *"  # snapshot per hour.
    - cron: "30 * * * *"
    - cron: "40 * * * *"
    - cron: "50 * * * *"
permissions:
  contents: write         # allow committing data back
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run collector
        run: python3 collect.py
      - name: Commit snapshot
        run: |
          git config user.name  "collector-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
      - name: Purge jsDelivr CDN cache (keep dashboard fresh)
        run: |
          for f in index.json latest.json; do
            curl -s -m 30 "https://purge.jsdelivr.net/gh/zhagqiu521-sudo/tk-topic-trends@main/data/$f" | head -c 200; echo ""
          done
          LATEST=$(ls -t data/snapshots/ | head -1)
          curl -s -m 30 "https://purge.jsdelivr.net/gh/zhagqiu521-sudo/tk-topic-trends@main/data/snapshots/$LATEST" | head -c 200; echo ""
