name: collect
on:
  workflow_dispatch: {}   # dispatched every 30 min by the Cloudflare trigger worker (tk-trigger)
  schedule:               # backup: GitHub can delay/drop these under load
    - cron: "0 * * * *"
    - cron: "30 * * * *"
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: true   # a hung/zombie run gets superseded by the next trigger instead of blocking it
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run collector
        env:
          TIKHUB_TOKEN: ${{ secrets.TIKHUB_TOKEN }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
        run: python3 collect.py
      - name: Commit snapshot (conflict-tolerant)
        run: |
          git config user.name  "collector-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git add data/
            if git diff --cached --quiet; then echo "no changes to commit"; exit 0; fi
            git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || true
            if git push; then exit 0; fi
            echo "push conflict, retry $i — pulling and re-adding"
            git pull --rebase --autostash || git reset --hard origin/main
          done
          echo "push failed 3x — data preserved locally, next run re-merges"
          exit 0
      - name: Purge jsDelivr CDN cache (keep dashboard fresh)
        if: always()
        run: |
          for f in index.json.enc latest.json.enc registry.json.enc backfill_state.json.enc; do
            curl -s -m 30 "https://purge.jsdelivr.net/gh/zhagqiu521-sudo/tk-topic-trends@main/data/$f" -o /dev/null
          done
          LATEST=$(ls -t data/snapshots/ | head -1)
          curl -s -m 30 "https://purge.jsdelivr.net/gh/zhagqiu521-sudo/tk-topic-trends@main/data/snapshots/$LATEST" -o /dev/null
